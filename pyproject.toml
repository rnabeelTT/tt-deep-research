[project]
name = "tt-deep-research"
version = "0.1.0"
description = "Deep research on a Tenstorrent QB2"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE.md"]
requires-python = ">=3.12"
dependencies = [
    "deepagents>=0.7.32",
    "httpx>=0.28",
    "huggingface-hub>=2.3.0",
    "langchain-openai>=1.7.3",
    "mcp>=2.3.0",
    "pillow>=13.0.0",
    "pyarrow>=26.0.0",
    "pydantic>=2.9",
    "pypdfium2>=5.14.0",
    "python-multipart>=0.0.32",
    "qdrant-client>=1.20.0",
    "redis>=8.1.0",
    "rich>=13.9",
    "trafilatura>=2.3.1",
    "typer>=0.15",
]

[project.optional-dependencies]
checker = ["torch>=2.6", "transformers>=4.57"]

[project.scripts]
ttdr = "ttdr.cli:app"

[dependency-groups]
dev = ["pytest>=8.3", "ruff>=0.8"]

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ttdr"]

# The app files `ttdr up` needs, staged into $TTDR_HOME by an installed ttdr (ttdr/home.py).
[tool.hatch.build.targets.wheel.force-include]
"compose.yaml" = "ttdr/_app/compose.yaml"
"recipe.toml" = "ttdr/_app/recipe.toml"
"recipes" = "ttdr/_app/recipes"
"configs" = "ttdr/_app/configs"
"docker" = "ttdr/_app/docker"
"workers" = "ttdr/_app/workers"
"scripts" = "ttdr/_app/scripts"
"patches" = "ttdr/_app/patches"
".dockerignore" = "ttdr/_app/.dockerignore"
"pyproject.toml" = "ttdr/_app/pyproject.toml"
"uv.lock" = "ttdr/_app/uv.lock"
"README.md" = "ttdr/_app/README.md"
"src/ttdr" = "ttdr/_app/src/ttdr"

[tool.ruff]
extend-exclude = ["external"]
line-length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]
