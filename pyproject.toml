[project]
name = "tt-deep-research"
version = "0.1.0"
description = "Deep research on a Tenstorrent QB2"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.28",
    "pydantic>=2.9",
    "rich>=13.9",
    "typer>=0.15",
]

[project.scripts]
ttdr = "ttdr.cli:app"

[dependency-groups]
dev = ["pytest>=8.3", "ruff>=0.8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ttdr"]

[tool.ruff]
line-length = 100
