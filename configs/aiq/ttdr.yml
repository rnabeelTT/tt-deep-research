# AI-Q pointed at the QB2: every LLM role on the recipe's llm, our MCP server as the data
# sources (web and documents), clarifier off so runs are unattended. This is a template: `ttdr aiq-config`
# (run by `ttdr up`) renders it with the recipe into data/aiq/config/ttdr.yml.
# Role split and thinking on/off mirror AI-Q's configs/config_cli_default.yml.
# Rendered, `nat serve` exposes the job API on :8100 (SQLite job store, local Dask, auth off).

general:
  use_uvloop: true
  front_end:
    _type: aiq_api
    runner_class: aiq_api.plugin.AIQAPIWorker
    host: 127.0.0.1
    port: 8100
    db_url: ${NAT_JOB_STORE_DB_URL:-sqlite+aiosqlite:///./data/aiq/jobs.db}
    expiry_seconds: 86400
    max_running_async_jobs: 4
    dask_workers: processes
    dask_threads_per_worker: 1
    cors:
      allow_origin_regex: 'http://(localhost|127\.0\.0\.1)(:\d+)?'
      allow_methods: [GET, POST, DELETE, OPTIONS]
      allow_headers: ["*"]
      allow_credentials: true
      expose_headers: ["*"]
  telemetry:
    logging:
      console:
        _type: console
        level: INFO

llms:
  # model_name, base_url and sampling are filled from the recipe's llm role (`ttdr aiq-config`).
  # enable_thinking below is each role's intent; rendering maps it to the model's reasoning control.
  intent_llm:
    _type: openai
    api_key: none
    max_tokens: 1024
    parallel_tool_calls: false
    extra_body: { chat_template_kwargs: { enable_thinking: false } }

  agent_llm:
    _type: openai
    api_key: none
    max_tokens: 32768
    parallel_tool_calls: false
    extra_body: { chat_template_kwargs: { enable_thinking: true } }

  researcher_llm:
    # thinking on (off, researchers never stop searching); 8K cap stops runaway reasoning
    _type: openai
    api_key: none
    max_tokens: 8192
    parallel_tool_calls: false
    extra_body: { chat_template_kwargs: { enable_thinking: true } }

  planner_llm:
    _type: openai
    api_key: none
    max_tokens: 16384
    extra_body: { chat_template_kwargs: { enable_thinking: false } }

  writer_llm:
    _type: openai
    api_key: none
    max_tokens: 32768
    extra_body: { chat_template_kwargs: { enable_thinking: false } }

# The engine serves each source as its own MCP endpoint (search pinned to it), so the UI can
# toggle the web and the private collections separately.
function_groups:
  web:
    _type: mcp_client
    server:
      transport: streamable-http
      url: http://localhost:9901/mcp/web   # filled from the recipe's services.mcp
  documents:
    _type: mcp_client
    server:
      transport: streamable-http
      url: http://localhost:9901/mcp/docs   # filled from the recipe's services.mcp

functions:
  data_sources:
    _type: data_source_registry
    sources:
      - id: web
        name: "Web search"
        description: >-
          The web, searched from the QB2 and reranked. Tools: search, fetch_page (read a page or PDF), get_evidence. Passages carry evidence IDs.
        tools:
          - web
      - id: documents
        name: "Our documents"
        description: >-
          Private document collections on the QB2 (listed below). Search them first for anything they cover.
          Tools: search, read_page (see a page's figures and tables), find_in_document (exact words inside one document), open_pages (read a passage's page and the pages after it), get_evidence. Passages carry evidence IDs and page links.
        tools:
          - documents

  intent_classifier:
    _type: intent_classifier
    llm: intent_llm

  clarifier_agent:
    _type: clarifier_agent
    llm: planner_llm
    max_turns: 3

  shallow_research_agent:
    _type: shallow_research_agent
    llm: agent_llm
    max_llm_turns: 10
    max_tool_iterations: 5

  deep_research_agent:
    _type: deep_research_agent
    enable_citation_verification: true
    orchestrator_llm: planner_llm
    source_router_llm: planner_llm
    researcher_llm: researcher_llm
    planner_llm: planner_llm
    writer_llm: writer_llm
    # Our sources are local (MCP + SearXNG), so budgets are generous; AI-Q's defaults assume paid APIs
    max_research_concurrency: 8
    max_concurrent_source_tool_calls: 16
    resource_limits:
      max_source_tool_calls: 1000
      max_research_queries: 60

workflow:
  _type: chat_deepresearcher_agent
  enable_escalation: true
  enable_clarifier: false
  use_async_deep_research: true
  checkpoint_db: ${AIQ_CHECKPOINT_DB:-./data/aiq/checkpoints.db}
