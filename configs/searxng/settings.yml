use_default_settings:
  engines:
    keep_only: [yandex, bing news, openalex]

server:
  limiter: false
  image_proxy: false

search:
  formats: [html, json]

# Bing (and Yahoo, which is Bing) answers only the first word of automated queries, and the other
# scraped engines are blocked or return Bing's results; see docs/JOURNEY.md (2026-11-03).
engines:
  - name: yandex
    disabled: false
  - name: bing news
    disabled: false
  - name: openalex
    disabled: false
