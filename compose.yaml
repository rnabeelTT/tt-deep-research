name: ttdr

services:
  qdrant:
    image: qdrant/qdrant:v1.19.2
    ports: ["127.0.0.1:6333:6333"]
    volumes: [qdrant:/qdrant/storage]
    restart: unless-stopped

  searxng:
    image: searxng/searxng:2026.10.19-81371861f
    ports: ["127.0.0.1:8888:8080"]
    environment:
      SEARXNG_SECRET: ${SEARXNG_SECRET:-ttdr-local}
    volumes: ["./configs/searxng/settings.yml:/etc/searxng/settings.yml:ro"]
    restart: unless-stopped

  redis:
    image: redis:8.8.4-alpine
    ports: ["127.0.0.1:6379:6379"]
    restart: unless-stopped

  # The app: `ttdr up` (renders data/aiq/config and .env from the recipe, then
  # `docker compose --profile app up -d <services>`). Host networking, so the
  # recipe's localhost URLs reach the models (tt serve) and data services unchanged.
  engine:
    profiles: [app]
    build: { context: ., dockerfile: docker/engine.Dockerfile }
    image: ttdr/engine:${TTDR_VERSION:-dev}
    network_mode: host
    working_dir: ${PWD}
    volumes: ["${PWD}:${PWD}:ro"]
    command: ["ttdr", "mcp"]
    environment:   # remote clients: TTDR_MCP_HOST=0.0.0.0 ttdr up (token optional)
      TTDR_RECIPE: ${TTDR_RECIPE:-recipe.toml}   # ttdr up --recipe <overlay>
      TTDR_MCP_HOST: ${TTDR_MCP_HOST:-}
      TTDR_MCP_TOKEN: ${TTDR_MCP_TOKEN:-}
      TTDR_PAGES_URL: ${TTDR_PAGES_URL:-}   # page links for document passages: <UI address>/pages
      TAVILY_API_KEY: ${TAVILY_API_KEY:-}   # keyed web search: services.web_search in the recipe
      BRAVE_API_KEY: ${BRAVE_API_KEY:-}
      SERPER_API_KEY: ${SERPER_API_KEY:-}
      PYTHONFAULTHANDLER: "1"   # a native crash prints the Python stack of every thread
    depends_on: [qdrant, searxng, redis]
    restart: unless-stopped

  aiq:
    profiles: [app]
    build: { context: external/aiq, dockerfile: deploy/Dockerfile, target: release }
    image: ttdr/aiq:${TTDR_VERSION:-dev}
    network_mode: host
    environment:
      CONFIG_FILE: /config/ttdr.yml
      HOST: 127.0.0.1
      PORT: "8100"
      DASK_SCHEDULER_PORT: "8796"
      NAT_JOB_STORE_DB_URL: sqlite+aiosqlite:////app/data/jobs.db
      AIQ_CHECKPOINT_DB: /app/data/checkpoints.db
      AIQ_AUTO_TOOL_CHOICE: ${AIQ_AUTO_TOOL_CHOICE:-0}   # from features.auto_tool_choice
    user: "${TTDR_UID:-1000}:${TTDR_GID:-1000}"   # host user, so ttdr jobs can read the job store
    volumes: ["./data/aiq/config:/config:ro", "./data/aiq/app:/app/data"]   # both from ttdr up
    depends_on: [engine]
    restart: unless-stopped

  ui:
    profiles: [app]
    build: { context: external/aiq/frontends/ui, dockerfile: deploy/Dockerfile }
    image: ttdr/ui:${TTDR_VERSION:-dev}
    network_mode: host
    environment:   # PAGES_URL: citations' page links (/pages/*) are served by the engine
      { BACKEND_URL: "http://127.0.0.1:8100", PORT: "3001", REQUIRE_AUTH: "false", PAGES_URL: "${TTDR_ENGINE_URL:-http://127.0.0.1:9901}" }
    healthcheck: { test: ["CMD", "curl", "-f", "http://localhost:3001/"] }   # the image's checks :3000
    depends_on: [aiq]
    restart: unless-stopped

  # The Deep Agents harness (the default, docs/LOG.md) behind the same UI: UI on :3000, API on :8200.
  # AI-Q's own backend keeps the UI on :3001 as the alternative harness.
  deepagents:
    profiles: [app]
    image: ttdr/engine:${TTDR_VERSION:-dev}
    network_mode: host
    working_dir: ${PWD}
    user: "${TTDR_UID:-1000}:${TTDR_GID:-1000}"   # uploads are the host user's files
    volumes: ["${PWD}:${PWD}:ro", "${PWD}/data/corpus/library:${PWD}/data/corpus/library"]   # the UI's uploads
    command: ["ttdr", "ui-server"]
    environment: { TTDR_RECIPE: "${TTDR_RECIPE:-recipe.toml}", HOME: /tmp }
    depends_on: [engine]
    restart: unless-stopped

  ui-deepagents:
    profiles: [app]
    image: ttdr/ui:${TTDR_VERSION:-dev}
    network_mode: host
    environment:
      BACKEND_URL: "http://127.0.0.1:8200"
      PORT: "3000"
      REQUIRE_AUTH: "false"
      PAGES_URL: "${TTDR_ENGINE_URL:-http://127.0.0.1:9901}"
      FILE_UPLOAD_MAX_FILE_COUNT: "${TTDR_UPLOAD_MAX_FILES:-1000}"   # the whole library, not one chat's files
      FILE_UPLOAD_MAX_SIZE_MB: "${TTDR_UPLOAD_MAX_MB:-2048}"
    depends_on: [deepagents]
    restart: unless-stopped

  ocr:
    profiles: [app]
    build: { context: workers/ocr }
    image: ttdr/ocr:${TTDR_VERSION:-dev}
    network_mode: host
    environment:   # backend from the recipe's ocr role, via the .env that ttdr up writes
      TTDR_CORPUS_DIR: /data/corpus
      TTDR_OCR_BACKEND: ${TTDR_OCR_BACKEND:-paddle}
      TTDR_OCR_URL: ${TTDR_OCR_URL:-}
      TTDR_OCR_MODEL: ${TTDR_OCR_MODEL:-}
    volumes: ["./data/corpus:/data/corpus:ro", "paddlex:/root/.paddlex"]
    depends_on: [redis]
    restart: unless-stopped

volumes:
  qdrant:
  paddlex:
