name: ttdr

services:
  qdrant:
    image: qdrant/qdrant:v1.19.2
    ports: ["127.0.0.1:6333:6333"]
    volumes: [qdrant:/qdrant/storage]
    restart: unless-stopped

  searxng:
    image: searxng/searxng:2026.10.19-81371861f
    ports: ["127.0.0.1:8888:8080"]
    environment:
      SEARXNG_SECRET: ${SEARXNG_SECRET:-ttdr-local}
    volumes: ["./configs/searxng/settings.yml:/etc/searxng/settings.yml:ro"]
    restart: unless-stopped

  redis:
    image: redis:8.8.4-alpine
    ports: ["127.0.0.1:6379:6379"]
    restart: unless-stopped

  # The app: `ttdr up` (renders data/aiq/config and .env from the recipe, then
  # `docker compose --profile app up -d <services>`). Host networking, so the
  # recipe's localhost URLs reach the models (tt serve) and data services unchanged.
  engine:
    profiles: [app]
    build: { context: ., dockerfile: docker/engine.Dockerfile }
    image: ttdr/engine:${TTDR_VERSION:-dev}
    network_mode: host
    working_dir: ${PWD}
    volumes: ["${PWD}:${PWD}:ro"]
    command: ["ttdr", "mcp"]
    environment:   # remote clients: TTDR_MCP_HOST=0.0.0.0 TTDR_MCP_TOKEN=... ttdr up (from your shell)
      TTDR_MCP_HOST: ${TTDR_MCP_HOST:-}
      TTDR_MCP_TOKEN: ${TTDR_MCP_TOKEN:-}
    depends_on: [qdrant, searxng, redis]
    restart: unless-stopped

  aiq:
    profiles: [app]
    build: { context: external/aiq, dockerfile: deploy/Dockerfile, target: release }
    image: ttdr/aiq:${TTDR_VERSION:-dev}
    network_mode: host
    environment:
      CONFIG_FILE: /config/ttdr.yml
      HOST: 127.0.0.1
      PORT: "8100"
      DASK_SCHEDULER_PORT: "8796"
      NAT_JOB_STORE_DB_URL: sqlite+aiosqlite:////app/data/jobs.db
      AIQ_CHECKPOINT_DB: /app/data/checkpoints.db
      AIQ_AUTO_TOOL_CHOICE: ${AIQ_AUTO_TOOL_CHOICE:-0}   # from features.auto_tool_choice
    volumes: ["./data/aiq/config:/config:ro", "aiq:/app/data"]   # rendered by ttdr up
    depends_on: [engine]
    restart: unless-stopped

  ui:
    profiles: [app]
    build: { context: external/aiq/frontends/ui, dockerfile: deploy/Dockerfile }
    image: ttdr/ui:${TTDR_VERSION:-dev}
    network_mode: host
    environment: { BACKEND_URL: "http://127.0.0.1:8100", PORT: "3000", REQUIRE_AUTH: "false" }
    depends_on: [aiq]
    restart: unless-stopped

  ocr:
    profiles: [app]
    build: { context: workers/ocr }
    image: ttdr/ocr:${TTDR_VERSION:-dev}
    network_mode: host
    environment:   # backend from the recipe's ocr role, via the .env that ttdr up writes
      TTDR_CORPUS_DIR: /data/corpus
      TTDR_OCR_BACKEND: ${TTDR_OCR_BACKEND:-paddle}
      TTDR_OCR_URL: ${TTDR_OCR_URL:-}
      TTDR_OCR_MODEL: ${TTDR_OCR_MODEL:-}
    volumes: ["./data/corpus:/data/corpus:ro", "paddlex:/root/.paddlex"]
    depends_on: [redis]
    restart: unless-stopped

volumes:
  qdrant:
  aiq:
  paddlex:
