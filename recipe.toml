version = "0.2.0"

# Models: a registry. `kind` decides the client (chat, embed, decide); `[roles]` decides the job.
# Swap a model by pointing a role at another entry (see recipes/*.toml overlays).

[models.ornith]
kind = "chat"
bundle = "raahemnabeel/ornith-1.5-35b-a3b"
profile = "p300"
model = "ornith-ai/Ornith-1.5-35B-A3B"
url = "http://localhost:8000/v1"
sampling = { temperature = 0.6, top_p = 0.95, top_k = 20 }
reasoning = "enable_thinking"
chat_template = "configs/chat_templates/ornith.jinja"
# The step budget keeps image prompts whole (docs/LOG.md). Since the mixed-vision build (2026-11-02)
# the bundle prefix-caches text requests and never caches requests with images.
serve_args = ["--max-num-batched-tokens", "262144"]
serve_order = 0

[models.embeddinggemma]
kind = "embed"
bundle = "tt-hous/embeddinggemma-2"
model = "google/embeddinggemma-2"
url = "http://localhost:8001/v1"
query_template = "task: {task} | query: {query}"
document_template = "title: {title} | text: {document}"
serve_order = 1

# Default embedder (docs/LOG.md): text chunks and page images in one 4,096-d space. Queries carry an
# instruction, documents don't. Its vectors live in their own collection.
[models.qwen3vl_embed]
kind = "embed"
bundle = "raahemnabeel/qwen3-vl-embedding-8b"
model = "Qwen/Qwen3-VL-Embedding-8B"
url = "http://localhost:8005/v1"
serve_order = 1
document_template = "{title}\n{document}"
instruction = "Given a research question, retrieve passages and document pages that help answer it"
collection = "chunks_qwen3vl"

[models.laya]
kind = "decide"
bundle = "tt-hous/laya"
model = "convaiinnovations/laya"
url = "http://localhost:8002"
max_state_tokens = 512
prefetch = ["convaiinnovations/laya@7b928d828b7b0e022f929d9bd2e44165aa270148"]
serve_order = 2

[roles]
llm = "ornith"
embed = "qwen3vl_embed"      # embeddinggemma: the previous default (collection chunks)
# judge = ...        # optional on-box judge for quick checks (defaults to llm); decisions use the Claude judge
decide = "laya"      # optional: without it, verify and triage are off
# ocr = "ornith"     # optional: OCR with a vision model on the chips instead of PaddleOCR on the CPU

[services]
qdrant = "http://localhost:6333"
searxng = "http://localhost:8888"   # optional: without it, search covers the corpus only
# web_search = "tavily"   # or "brave", "serper": used when TAVILY_API_KEY etc. is set, else SearXNG
redis = "redis://localhost:6379"
mcp = "http://localhost:9901/mcp"

# What each private collection holds: agents read this to decide when to search the corpus.
[corpora]
financebench = "Annual and quarterly reports (10-K, 10-Q, 8-K) of about 40 large US public companies, 2015-2023"
unidoc = "Energy and construction documents: technical and research reports, standards, manuals, safety and planning documents, with many charts, diagrams and tables"

[features]
triage = false       # Laya reranking lowers recall (docs/LOG.md)
ocr = true
ui = true
auto_tool_choice = true    # AI-Q agents choose their tools instead of a forced call each turn (docs/LOG.md)
