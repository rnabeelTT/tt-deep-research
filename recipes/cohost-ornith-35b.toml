extends = "../recipe.toml"
description = "Fastest: the same models in one bundle on all four chips, reads page images. 212 tok/s for one user, 839 across 8 (1.5-1.7x the default); needs the cohost tt-model"

# Ornith 1.5 35B-A3B cohosted with the embedder and reranker on all four chips, one bundle, instead
# of three bundles on chips 0-1, 2 and 3 (docs/LOG.md).
[models.ornith]
bundle = "raahemnabeel/cohost-ornith-35b-qwen3vl"
profile = "ornith35b-vision"   # the bundle's default since 2026-11-06: the embedder and reranker take images
serve_args = []
chips = "0-3"
cohosts = ["qwen3vl_embed", "reranker"]   # `ttdr up` serves the bundle with tt-model, not tt
