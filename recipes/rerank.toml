extends = "llm-verify.toml"

# Qwen3-VL-Reranker-8B on chip 3 (in Laya's place; Ornith answers verify) reorders the top 30
# embedding hits before the agent sees them (docs/LOG.md).
[models.reranker]
kind = "rerank"
bundle = "raahemnabeel/qwen3-vl-reranker-8b"
model = "Qwen/Qwen3-VL-Reranker-8B"
url = "http://localhost:8004/v1"
serve_order = 3
instruction = "Given a research question, retrieve passages that contain information needed to answer it"

[roles]
rerank = "reranker"
