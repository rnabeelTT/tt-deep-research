extends = "../recipe.toml"
description = "The default with Tavily for web search instead of SearXNG: no rate-limit lockouts; needs TAVILY_API_KEY (free tier ~1,000 searches a month)"

# Tavily as the web backend (TAVILY_API_KEY in .env). Opt-in only: the free tier is ~1,000
# searches a month and one DRB dev run takes several hundred, so A/Bs use it on purpose.
[services]
web_search = "tavily"
