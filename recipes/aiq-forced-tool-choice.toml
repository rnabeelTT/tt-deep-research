extends = "../recipe.toml"

# AI-Q as shipped: LangChain forces the structured-output tool on every planner and researcher
# turn. Forced calls are served with guided decoding (~13 tok/s for the whole batch on Ornith).
# The A/B against the default is in docs/LOG.md (2026-10-29).
[features]
auto_tool_choice = false
aiq = true   # an AI-Q A/B: its job API and UI

[roles]
decide = "laya"   # as the A/B ran: Laya checks claims, no reranker
rerank = ""
