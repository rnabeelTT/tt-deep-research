extends = "rerank.toml"

# Ornith 1.5 35B-A3B cohosted with the embedder and reranker on all four chips, one bundle, instead
# of three bundles on chips 0-1, 2 and 3 (docs/LOG.md).
[models.ornith]
bundle = "raahemnabeel/cohost-ornith-35b-qwen3vl"
profile = "ornith35b"
serve_args = []
cohosts = ["qwen3vl_embed", "reranker"]   # `ttdr up` serves the bundle with tt-model, not tt

# The bundle's embedder is text-only: its ornith35b-vision profile (QWEN3VL_COHOST_VISION=1) fails
# to boot in the published image (docs/LOG.md, 2026-11-06).
[models.qwen3vl_embed]
vision = false
