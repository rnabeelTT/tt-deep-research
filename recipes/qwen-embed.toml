extends = "rerank.toml"

# Qwen3-VL-Embedding-8B in embeddinggemma's place on chip 2: text chunks and page images in one
# 4,096-d space, in its own collection, so the embeddinggemma index stays for the A/B (docs/LOG.md).
[models.qwen3vl_embed]
kind = "embed"
bundle = "raahemnabeel/qwen3-vl-embedding-8b"
model = "Qwen/Qwen3-VL-Embedding-8B"
url = "http://localhost:8005/v1"
serve_order = 1
document_template = "{title}\n{document}"
instruction = "Given a research question, retrieve passages and document pages that help answer it"
collection = "chunks_qwen3vl"

[roles]
embed = "qwen3vl_embed"
